<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Cakrawala - Minecraft Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar Melayang (Floating Navbar) -->
    <nav class="floating-navbar">
        <!-- Logo di Sisi Kiri -->
        <div class="nav-logo">
            <img src="image_1.png" alt="Beyond Cakrawala Logo">
        </div>

        <!-- Semua Menu Kumpul di Sisi Kanan -->
        <div class="nav-menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#member">Media</a>
            <a href="#project">Project</a>
            <a href="#store">Store</a>
        </div>
    </nav>

    <!-- Area Hero / Tampilan Awal Full Screen -->
    <div class="hero-container">
        <!-- Background Image -->
        <div class="bg-image" id="bgImage"></div>
        <!-- Overlay Hitam Transparan -->
        <div class="bg-overlay"></div>
        
        <!-- Logo di Tengah -->
        <div class="logo-wrapper">
            <img src="image_1.png" alt="Beyond Cakrawala Logo" class="main-logo">
        </div>
    </div>

    <!-- Area Konten (Di bawah Hero, untuk bisa di-scroll) -->
    <div class="content-section">
        <h2>Selamat Datang di Beyond Cakrawala</h2>
        <p>Scroll ke bawah untuk melihat keajaiban dunia kami...</p>
        <!-- Tambahkan konten lain di sini untuk membuat halaman panjang -->
        <div style="height: 100vh;"></div> <!-- Spacer biar bisa di-scroll -->
        <p>Ini adalah area konten utama kamu.</p>
        <div style="height: 100vh;"></div> <!-- Spacer biar bisa di-scroll -->
    </div>

    <script src="script.js"></script>
</body>
</html>
